<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForeignersLove - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#ff416c,#ff4b2b);height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:white;padding:35px;border-radius:20px;width:90%;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,0.2);text-align:center}
.logo{font-size:28px;font-weight:bold;color:#ff416c;margin-bottom:5px}
.sub{color:#777;margin-bottom:25px;font-size:14px}
input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{width:100%;padding:14px;background:#ff416c;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold;margin-top:15px;cursor:pointer}
button:hover{background:#ff2a5a}
.small{font-size:12px;color:#999;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<div class="logo">ForeignersLove ❤️</div>
<div class="sub">Find your true love in Kenya</div>
<input id="name" placeholder="Your Full Name" required>
<input id="phone" placeholder="Your Phone / WhatsApp" required>
<input id="password" type="password" placeholder="Create Password" required>
<button onclick="login()">Enter Site</button>
<div class="small">By continuing, you agree to our Terms. 18+ Only</div>
</div>
<script>
function login(){
 let n=document.getElementById('name').value;
 let p=document.getElementById('phone').value;
 let pw=document.getElementById('password').value;
 if(!n||!p||!pw){alert('Fill all fields');return;}
 localStorage.setItem('fl_user',n);
 localStorage.setItem('fl_phone',p);
 window.location='chat.html';
}
</script>
</body>
</html>
